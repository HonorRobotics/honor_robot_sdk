# RouDi 共享内存配置 —— 适用于 8GB 内存的开发板
# 共享内存总量约 1.85 GB（1768 MiB）。
# 用法：./run_roudi.sh roudi_config_8g.toml  或  ROUDI_CONFIG=roudi_config_8g.toml ./run_roudi.sh

[general]
version = 1


[[segment]]

[[segment.mempool]]
size = 128
count = 100000

[[segment.mempool]]
size = 1024
count = 80000

[[segment.mempool]]
size = 16384
count = 2000

[[segment.mempool]]
size = 131072
count = 300

[[segment.mempool]]
size = 524288
count = 300

[[segment.mempool]]
size = 1048576
count = 300

[[segment.mempool]]
size = 6300000
count = 50

[[segment.mempool]]
size = 10000000
count = 50

[[segment.mempool]]
size = 50000000
count = 8
