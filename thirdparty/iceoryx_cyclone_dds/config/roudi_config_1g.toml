size = 128
count = 10000

[[segment.mempool]]
size = 1024
count = 10000

[[segment.mempool]]
size = 16384
count = 1000

[[segment.mempool]]
size = 131072
count = 200

[[segment.mempool]]
size = 524288
count = 100

[[segment.mempool]]
size = 1048576
count = 50

[[segment.mempool]]
size = 6300000
count = 4

[[segment.mempool]]
size = 10000000
count = 2

[[segment.mempool]]
size = 50000000
count = 1
