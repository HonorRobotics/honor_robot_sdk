# RouDi 共享内存配置 —— 适用于 1GB 内存的开发板
# 共享内存总量约 0.25 GB（242 MiB），请在板子内存紧张的场景使用。
# 用法：./run_roudi.sh roudi_config_1g.toml  或  ROUDI_CONFIG=roudi_config_1g.toml ./run_roudi.sh

[general]
version = 1


[[segment]]

